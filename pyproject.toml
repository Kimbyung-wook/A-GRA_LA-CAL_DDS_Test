[project]
name = "agra-lacal"
version = "0.1.0"
description = "A-GRA (AMS-GRA) message exchange over an OMS Language-Agnostic CAL server with a Cyclone DDS backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13",
    "xmlschema>=3.4",
    "lxml>=5",
    "cyclonedds>=0.10.5",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# Scripts run from the project root (python -m server, tools/*.py); nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
